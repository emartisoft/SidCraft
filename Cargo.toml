[package]
name = "sidcraft"
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-only"
build = "build.rs"

[dependencies]
eframe = "0.31"
cpal = "0.17"
dirs = "6"
md-5 = "0.10"
mos6502 = "0.9"
residfp = { git = "https://github.com/mlund/residfp", features = ["ekv-filter"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
ureq = "3"
rfd = "0.15"
hound = "3"
# Local socket used to hand a file to an already running instance.
interprocess = "2.4"
# GitHub release checks and in-app update downloads.
serde_json = "1"
sha2 = "0.10"
# Parsing CSDb's "Releases which use this SID" table.
scraper = "0.29"
# Random playlist generation from the loaded HVSC index.
rand = "0.9"
# Native window handle used for OS-level mini-player opacity.
raw-window-handle = "0.6"

# Embeds icon/sidcraft.ico into the Windows executable so Explorer, the task
# bar and Alt+Tab show the application icon.
[build-dependencies]
winres = "0.1"

# Lets the process set an explicit AppUserModelID, so Windows shows the
# SidCraft icon (and not a generic one) on the task bar button.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Windows update archives are distributed as ZIP files.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

# Receives the "open documents" AppleEvent when a SID file is opened with
# SidCraft in Finder. macOS does not pass such files as command line
# arguments to application bundles.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSAppleEventDescriptor",
    "NSAppleEventManager",
    "NSObject",
    "NSString",
    "NSURL",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

